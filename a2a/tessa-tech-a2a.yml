conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming and
    pushNotifications, both false. protocolVersion is present at the top level (pass), declared as "0.3.0".
    skills is an ARRAY (pass) of nine skills, each with id, name, description and tags. All three optional
    discriminators are present: preferredTransport (JSONRPC), defaultInputModes and defaultOutputModes
    (application/json + text/plain). This is a 0.3.0-shaped card — top-level url + preferredTransport +
    additionalInterfaces + protocolVersion rather than the 1.0.0 supportedInterfaces[] block — and it is
    internally consistent with that revision.
  deviations:
  - field: protocolVersion / url / preferredTransport / additionalInterfaces
    observed: 0.3.0 top-level shape; no supportedInterfaces[]
    note: >-
      Valid for A2A 0.3.0, which the card declares. A reader written against A2A 1.0.0 looks for
      supportedInterfaces[].protocolBinding and will not find it. Recorded because both shapes coexist in the
      catalog, not as a fault.
  - field: url
    observed: https://aiagent.tessa.tech (host root)
    note: >-
      The card's url is the host root, while the provider's own root document says the A2A JSON-RPC endpoint is
      "POST / or /a2a". A tasks/get probe against /a2a returned a proper A2A -32001 TaskNotFound, so both paths
      appear to be served; the card points at the root form.
  - field: securitySchemes / security
    observed: absent
    note: >-
      The card declares no authentication scheme. Live probing agrees: the A2A endpoint, the agent card and the
      MCP server all answered anonymously. Four of the nine skills create real side effects (a calendar booking,
      a lead, a claim, a quote request) with no credential gate other than the prospect email the caller supplies.
  - field: iconUrl
    observed: https://tessa.tech/wp-content/uploads/2024/12/tessa-icon-256.png
    note: Returned HTTP 404 (nginx "404 Not Found", 548 bytes) when fetched 2026-09-19. A broken icon link, not a conformance failure.
  - field: skills[].examples
    observed: absent on every skill
    note: Optional per-skill field; the card relies on descriptions and tags. Four skills declare inputModes application/json, the rest inherit the defaults.
  - field: signatures
    observed: absent
    note: No JWS signature block; the card's authenticity rests on TLS to aiagent.tessa.tech plus the did:web document that references it.
surface_relationship:
  note: >-
    TESSA publishes three agent surfaces on one host and they are projections of one service: A2A — nine skills
    at https://aiagent.tessa.tech (JSON-RPC), plus a per-service card fleet under /s/{slug}/agent-card.json
    (28 service cards indexed at /s, each with its own /s/{slug}/a2a endpoint) and per-tenant cards under
    /t/{slug}/; MCP — ten tools at https://aiagent.tessa.tech/mcp/ (Streamable HTTP, anonymous; see
    mcp/tessa-tech-mcp.yml), nine of which correspond one-to-one with the A2A skills (assess_ai_readiness ↔
    ai-readiness-assessment, and so on) with get_firm_profile the one MCP-only tool; REST — 51 operations in
    the FastAPI OpenAPI (see openapi/), of which the firm profile, introduction, claim, verify, removal and
    takedown routes back the directory skills (see mcp/tessa-tech-tool-crosswalk.yml). A fourth, separate MCP
    server runs on the WordPress apex at https://tessa.tech/wp-json/mcp/mcp-oauth-server behind OAuth 2.1
    (scope "mcp"); it is not referenced by this card.
