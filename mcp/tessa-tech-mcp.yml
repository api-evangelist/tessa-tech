  - https://marketingregistry.org/mcp/
  note: The Compliance Registry agent card (https://complianceregistry.net/.well-known/agent-card.json, provider
    TESSA) states 'Powered by TESSA's MCP server, served via Streamable HTTP at /mcp/' and both registry hosts serve
    the byte-identical OpenAPI. Not introspected in this pass; recorded as declared by the provider.
