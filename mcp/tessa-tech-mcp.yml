tools:
- name: get_services
  description: "List the services TESSA Marketing & Technology offers: SEO, paid ads,\n        website\
    \ design and development, AI chatbots and avatars, AI agent\n        readiness, and web accessibility.\
    \ Use this when someone asks what TESSA\n        does. For current prices call get_pricing.\n\n  \
    \      Optional filters:\n            category_slug: marketing | web-development | ai-experiences\
    \ | accessibility\n            service_slug:  one service, for example 'seo'"
  category: catalog
  input_schema:
    required: []
    properties:
      category_slug:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      service_slug:
        anyOf:
        - type: string
        - type: 'null'
        default: null
  side_effects: none (read-only)
  a2a_skill: tessa-services
- name: get_pricing
  description: "TESSA's current starting prices for every service, read live from\n        https://tessa.tech/pricing/\
    \ (for example SEO, PPC, websites, AI avatars,\n        accessibility). Use this when someone asks\
    \ what TESSA charges or wants\n        to compare prices.\n\n        service: optional keyword to\
    \ filter, for example 'seo' or 'website'"
