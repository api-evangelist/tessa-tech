summary: 'TESSA Marketing & Technology runs a hosted, anonymous MCP server on its own agent host: Streamable
  HTTP at https://aiagent.tessa.tech/mcp/, serverInfo name tessa-mcp-server version 1.30.0, protocolVersion
  2025-06-18, ten tools, no resources and no prompts. It is advertised three ways from the same host —
  an MCP server.json at /.well-known/mcp/server.json (2025-12-11 registry schema, remotes[] streamable-http),
  the did:web document''s MCPServer service entry, and the root document''s mcp_endpoint field — and the
  A2A agent card''s nine skills map one-to-one onto nine of the ten tools. A second, separate MCP server
  runs on the WordPress apex behind OAuth 2.1 and could not be introspected anonymously; it is recorded
  below as gated.'
