- name: assess_ai_readiness
  description: "Quick automated check of how ready a website is for AI assistants and\n        agents:\
    \ 12 of the 46 items in TESSA's AI Readiness audit, checked on the\n        homepage and a few standard\
    \ files in about 15 seconds. Not the full audit.\n\n        Items (by audit number): 4 robots.txt\
    \ allows AI crawlers, 5 the firewall\n        serves the homepage to real AI crawler user agents (OAI-SearchBot,\n\
    \        PerplexityBot, Claude-User) the same as to a browser, 6 content readable\n        without\
    \ JavaScript, 7 XML sitemap, 8 llms.txt, 9 /pricing.md,\n        10 Organization or LocalBusiness\
    \ schema, 16 one H1, 18 phone, address and\n        hours as plain text, 32 schema potentialAction,\
    \ 41 A2A agent card,\n        43 MCP server card.\n\n        Returns each item's status (pass, partial,\
    \ fail or could_not_check) with\n        evidence and a plain-English fix, a 0 to 100 overall_score\
    \ over the items\n        that could be checked (could_not_check never counts as a fail), what the\n\
    \        full audit adds, and TESSA's contact details. The full audit covers all 46\n        items\
    \ across the site plus a live ChatGPT, Claude, Perplexity and Gemini\n        citation test; book\
    \ it with request_strategy_session.\n\n        url: the website to check, for example https://example.com"
  category: assessment
  input_schema:
    required:
    - url
    properties:
      url:
        type: string
  side_effects: none (read-only)
  a2a_skill: ai-readiness-assessment
- name: assess_seo
  description: "Free quick SEO check of any website's homepage: indexability (noindex,\n        robots.txt,\
    \ sitemap), title and meta description, one clear H1,\n        canonical, mobile setup and speed;\
    \ 0 to 100 score, what passes and\n        fails, how to fix each. Automated, homepage only, not a\
    \ full SEO audit.\n\n        12 items, about 12 seconds. Each item has a status (pass, partial, fail\n\
    \        or could_not_check), evidence and a plain-English fix; the score covers\n        only the\
    \ items that could be checked. For TESSA's SEO service call\n        get_seo_offer; to talk it through,\
    \ book with request_strategy_session.\n\n        url: the website to check, for example https://example.com"
- name: assess_ad_tracking
  description: "Free quick ad tracking check of any website's homepage: GA4, Google Tag\n        Manager,\
    \ Google Ads, Meta Pixel, Microsoft and LinkedIn tags, call\n        tracking, consent, phone link,\
    \ form or call to action, and speed; 0 to\n        100 score, what passes and fails, how to fix each.\
    \ Tags inside Google\n        Tag Manager are looked up in its published container; if it cannot be\n\
    \        read they are reported as could not check, never as missing.\n        Automated, homepage\
    \ only, not a full ad account audit.\n\n        11 items, about 12 seconds. Each item has a status\
    \ (pass, partial, fail\n        or could_not_check), evidence and a plain-English fix; the score covers\n\
    \        only the items that could be checked. For TESSA's advertising service\n        call get_advertising_offer;\
    \ to talk it through, book with\n        request_strategy_session.\n\n        url: the website to\
    \ check, for example https://example.com"
- name: assess_website
  description: "Free quick website check of any website's homepage: HTTPS, mobile\n        setup, load\
    \ time and page weight, platform, security headers, basic\n        accessibility signals, contact\
    \ form or chat, and an up-to-date footer;\n        0 to 100 score, what passes and fails, how to fix\
    \ each. Automated,\n        homepage only, not a full website audit.\n\n        12 items (the platform\
    \ is reported, not scored), about 12 seconds. Each\n        item has a status (pass, partial, fail\
    \ or could_not_check), evidence and\n        a plain-English fix; the score covers only the items\
    \ that could be\n        checked. For TESSA's website and AI development service call\n        get_web_ai_development_offer,\
    \ for a full accessibility audit\n        get_wcag_audit; to talk it through, book with request_strategy_session.\n\
    \n        url: the website to check, for example https://example.com"
- name: request_strategy_session
  description: "Book a free 30-minute strategy session with TESSA (with Kevin Callen,\n        President).\
    \ Finds an open slot, creates a Google Meet invite and emails\n        it to the prospect. Only call\
    \ this when the user has asked to book a\n        call and has given their real email address.\n\n\
    \        prospect_email:   the user's email (required; temporary inboxes are refused)\n        prospect_name:\
    \    the user's name\n        prospect_org:     the user's company\n        project_brief:    what\
    \ they want help with\n        requested_window: when they are free, for example '2026-10-06',\n \
    \                         '2026-10-06T13:00/2026-10-06T17:00', 'tomorrow' or 'next week'\n\n     \
    \   Up to 10 bookings per email per 7 days; past that it returns status 'duplicate'."
  category: lead
  input_schema:
    required:
    - prospect_email
    properties:
      prospect_email:
        type: string
      prospect_name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      prospect_org:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      project_brief:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      requested_window:
        anyOf:
        - type: string
        - type: 'null'
        default: null
  side_effects: Creates a Google Calendar event with a Google Meet link on Kevin Callen's calendar and
    emails the prospect; falls back to capturing a lead when no slot is free.
  a2a_skill: request-strategy-session
