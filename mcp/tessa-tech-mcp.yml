- name: WordPress MCP (mcp-oauth-server)
  host: tessa.tech
  url: https://tessa.tech/wp-json/mcp/mcp-oauth-server
  transport: http (WordPress REST route, methods POST/GET/DELETE)
  deployment:
    mode: remote
    endpoint: https://tessa.tech/wp-json/mcp/mcp-oauth-server
    auth: oauth
    verified: probed
    probe: gated
  auth:
    methods:
    - oauth2
    oauth2:
      issuer: https://tessa.tech
      authorization_endpoint: https://tessa.tech/oauth/authorize
      token_endpoint: https://tessa.tech/oauth/token
      revocation_endpoint: https://tessa.tech/oauth/revoke
      grant_types:
      - authorization_code
      - refresh_token
      pkce: S256
      scopes_supported:
      - mcp
      token_endpoint_auth_methods_supported:
      - none
      client_id_metadata_document_supported: true
      discovery: well-known/tessa-tech-oauth-authorization-server.json
      protected_resource_metadata: well-known/tessa-tech-oauth-protected-resource.json
  probe:
    tools_list_anonymous:
      http_status: 401
      body: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
    www_authenticate: absent (the 401 body carries the challenge; no WWW-Authenticate header with resource_metadata
      was returned, so an MCP client must find the RFC 9728 document by convention at /.well-known/oauth-protected-resource)
  tools: unknown — tools/list is OAuth-gated; input schemas require authenticated introspection. Not derived.
  note: The WordPress REST index lists namespace 'mcp' with routes /mcp/mcp-oauth-server and /mcp/mcp-adapter-default-server
    (the latter answers 401 rest_forbidden), alongside a 'wp-abilities/v1' namespace — the WordPress MCP Adapter
    / Abilities API stack. This is the resource the apex's RFC 9728 document names.
- name: Registry-host mounts of the same server
