tool_count: 10
tools:
- name: get_services
  category: catalog
  description: 'Returns TESSA''s full service catalog (SEO, paid media, web/app development, AI agent readiness,
    accessibility, and more). Each service includes its live per-service A2A card URL (`agent_card`) and JSON-RPC
    endpoint (`a2a_endpoint`), so you can discover a service here and then talk to its dedicated A2A agent. Optional
    filters: category_slug: marketing | web-development | ai-experiences service_slug: filter to one specific service'
  input_schema:
    required: []
    properties:
      category_slug:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      service_slug:
        anyOf:
        - type: string
        - type: 'null'
        default: null
  side_effects: none (read-only)
  a2a_skill: tessa-services
- name: get_case_studies
  category: catalog
  description: 'Returns TESSA''s portfolio of project results. Optional filters: industry: industry name keyword
    (case-insensitive contains) service_slug: filter to studies that used a given service'
  input_schema:
    required: []
    properties:
      industry:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      service_slug:
        anyOf:
        - type: string
        - type: 'null'
        default: null
  side_effects: none (read-only)
  a2a_skill: tessa-case-studies
- name: assess_ai_readiness
  category: assessment
  description: Given a website URL, returns a 0-100 AI Agent Readiness score with category breakdowns (structured
    data, metadata quality, agent discoverability, AI-bot friendliness) and concrete recommendations. Pure deterministic
    check, fast, no LLM call.
  input_schema:
    required:
    - url
    properties:
      url:
        type: string
  side_effects: none (read-only)
  a2a_skill: ai-readiness-assessment
- name: find_professional_services_firm
  category: directory
  description: 'Search the TESSA Professional Services Directory. industry: segment slug (''marketing'' | ''compliance'')
    or free-text keyword region: city or state name (case-insensitive contains) capability: keyword to match against
    firm descriptions and service names limit: max results'
  input_schema:
    required: []
    properties:
      industry:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      region:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      capability:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      limit:
        default: 20
        type: integer
  side_effects: none (read-only)
  a2a_skill: find-professional-services-firm
- name: get_firm_profile
  category: directory
  description: 'Returns the full dossier for a single firm in the directory: description, headquarters, founded
    year, employee band, services, locations, and directory meta (publisher, claim URL, takedown URL).'
  input_schema:
    required:
    - slug
    properties:
      slug:
        type: string
  side_effects: none (read-only)
  a2a_skill: null
  note: 'MCP-only: no A2A skill; backed by the REST firm profile route (see the crosswalk).'
- name: get_wcag_audit
  category: catalog
  description: 'Returns the structured offering for TESSA''s WCAG 2.2 AA Accessibility Audit: scope, deliverables,
    timeline, pricing bands (hourly + engagement range), paired service-type slugs, and the URL of TESSA''s profile
    in the TESSA Compliance Registry. Use this when a buyer agent needs TESSA''s accessibility audit offering in
    structured form.'
  input_schema:
    required: []
    properties: {}
  side_effects: none (read-only)
  a2a_skill: get-wcag-audit
- name: request_strategy_session
  category: lead
  description: Book a 30-minute strategy session with TESSA on Kevin Callen's calendar. Finds an open slot in the
    requested window (or the next 5 business days), creates a Google Calendar event with a Google Meet link, and
    emails the prospect the invite. If no slot is available, captures the lead and Kevin follows up manually. TESSA-only
    tool — directory firms use request_introduction instead. requested_window accepts ISO 8601 ranges ('2026-04-30T13:00/2026-04-30T17:00'),
    single dates ('2026-04-30'), or English ('tomorrow', 'next week').
  input_schema:
    required:
    - prospect_email
    properties:
      prospect_email:
        type: string
      prospect_name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      prospect_org:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      project_brief:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      requested_window:
        anyOf:
        - type: string
        - type: 'null'
        default: null
  side_effects: Creates a Google Calendar event with a Google Meet link on Kevin Callen's calendar and emails the
    prospect; falls back to capturing a lead when no slot is free.
  a2a_skill: request-strategy-session
- name: request_introduction
  category: lead
  description: Request an informational introduction — to TESSA itself, or to any directory firm if you pass target_firm_slug.
    TESSA logs the lead and either notifies sales@tessa.tech + kevincallen@tessa.tech (TESSA leads) or forwards
    a warm intro email to the firm with TESSA Cc'd (directory leads). No calendar booking — use request_strategy_session
    to book a meeting with TESSA.
  input_schema:
    required:
    - prospect_email
    properties:
      prospect_email:
        type: string
      prospect_name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      prospect_org:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      project_brief:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      requested_window:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      target_firm_slug:
        anyOf:
        - type: string
        - type: 'null'
        default: null
  side_effects: Logs a lead; notifies sales@tessa.tech + kevincallen@tessa.tech (TESSA leads) or forwards a warm
    intro email to the target firm with TESSA Cc'd.
  a2a_skill: request-introduction
- name: claim_listing
  category: directory
  description: Record a firm's intent to claim its directory listing. Pre-OAuth this does NOT automatically grant
    control of the listing. TESSA logs the claim and a representative reaches out via email within one business
    day to verify the claimant and switch the listing's verification status to 'claimed'. The full self-service
    OAuth-2.1 claim flow lands in a follow-up plan.
  input_schema:
    required:
    - firm_slug
    - claim_email
    properties:
      firm_slug:
        type: string
      claim_email:
        type: string
      claimant_name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      claimant_role:
        anyOf:
        - type: string
        - type: 'null'
        default: null
  side_effects: Logs a claim intent; a representative verifies by email within one business day. Does NOT grant
    listing control (pre-OAuth stub, per the tool description).
  a2a_skill: claim-listing
- name: request_quote
  category: lead
  description: 'Request a quote from a directory firm. Lighter-weight than request_introduction — explicitly framed
    as a budget+scope inquiry. firm_slug: directory slug for the target firm prospect_email: caller''s email for
    the firm''s reply scope_summary: one-paragraph description of the work budget_band: ''under_5k'' | ''5k_25k''
    | ''25k_100k'' | ''100k_plus'' | ''open'' — or any free-text dollar figure'
  input_schema:
    required:
    - firm_slug
    - prospect_email
    - scope_summary
    properties:
      firm_slug:
        type: string
      prospect_email:
        type: string
      scope_summary:
        type: string
      budget_band:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      prospect_name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      prospect_org:
        anyOf:
        - type: string
        - type: 'null'
        default: null
      requested_window:
        anyOf:
        - type: string
        - type: 'null'
        default: null
  side_effects: Records the request to directory_leads and emails the firm with the prospect's reply-to address.
  a2a_skill: request-quote
