generated: '2026-09-19'
method: derived
source: >-
  Derived by aligning the live MCP tools/list (mcp/tessa-tech-mcp-tools-list.json, 10 tools with inputSchema,
  fetched anonymously 2026-09-19) and the A2A agent card's nine skills (a2a/tessa-tech-agent-card.json) with the
  51 operations in the provider's OpenAPI (openapi/tessa-tech-agent-directory-openapi.yml; verbatim source in
  openapi/_original/tessa-tech-openapi.json). Confidence per row; nothing mapped that does not exist.
purpose: >-
  Bind each agent-facing tool to the REST operation that backs it so the tool inherits a real request contract,
  and record where the surfaces diverge. TESSA's three surfaces are projections of one FastAPI service: the MCP
  tools are the richest projection (the only one with published inputSchema), the A2A skills mirror nine of the
  ten tools, and the REST OpenAPI exposes the directory's firm/claim/verify/removal/takedown plumbing that the
  tools sit on — while the four catalog/assessment tools have no public REST route at all.
surfaces:
  rest_openapi: openapi/tessa-tech-agent-directory-openapi.yml     # 51 operations, 48 paths; no securitySchemes; registry routes 421 on aiagent, live on complianceregistry.net / marketingregistry.org
  mcp: https://aiagent.tessa.tech/mcp/                                 # Streamable HTTP, anonymous; tools/list NOT gated — schemas below are real
  a2a: https://aiagent.tessa.tech                                      # JSON-RPC (also /a2a); nine skills; card at /.well-known/agent-card.json
  mcp_gated: https://tessa.tech/wp-json/mcp/mcp-oauth-server          # WordPress MCP, OAuth 2.1 scope "mcp"; tools unknown, not mapped

# Each MCP tool -> the REST operationId(s) that back it, plus the A2A skill id that mirrors it.
crosswalk:
  - tool: get_firm_profile
    category: directory
    a2a_skill: null
    rest: [firm_profile__slug__profile_json_get, firm_card__slug__agent_card_json_get]
    binding: rest
    confidence: high
    note: >-
      Tool input {slug} = the REST path parameter {slug}; the tool description ("full dossier ... directory meta
      (publisher, claim URL, takedown URL)") matches /{slug}/profile.json. The per-firm agent card at
      /{slug}/agent-card.json is the same record in A2A form. Both routes are host-scoped to the registry hosts.
  - tool: request_introduction
    category: lead
    a2a_skill: request-introduction
    rest: [firm_request_introduction__slug__request_introduction_post]
    binding: rest
    confidence: high
    note: >-
      When target_firm_slug is supplied the tool is POST /{slug}/request-introduction. Without it the tool routes
      the lead to TESSA itself, for which no public REST route exists (server-side path) — so the binding is
      exact for directory leads and partial for TESSA leads.
  - tool: claim_listing
    category: directory
    a2a_skill: claim-listing
    rest: [firm_claim_stub__slug__claim_get, verify_submit_verify_listing_post, verify_confirm_verify_listing_confirm__token__get]
    binding: rest
    confidence: medium
    note: >-
      /{slug}/claim is a GET "claim stub" landing (the operationId says stub, as does the tool text: "Pre-OAuth this
      does NOT automatically grant control"). The email-verification loop the tool describes matches the
      /verify-listing form + /verify-listing/confirm/{token} pair. Same intent, different mechanics — the tool
      records a claim, the REST routes render forms and confirm tokens.
  - tool: find_professional_services_firm
    category: directory
    a2a_skill: find-professional-services-firm
    rest: [registry_index_registry_json_get, registry_jsonrpc_registry_jsonrpc_post]
    binding: rest
    confidence: medium
    note: >-
      The directory index is /registry.json (a static A2A registry index per host; complianceregistry.net returned
      8,400 bytes, marketingregistry.org 847 bytes) and there is a /registry/jsonrpc route. The tool's filters
      (industry, region, capability, limit) are applied server-side across ALL registries TESSA operates; no REST
      operation exposes those query parameters, so the tool is the only filtered search surface.
  - tool: request_quote
    category: lead
    a2a_skill: request-quote
    rest: []
    binding: none
    confidence: high
    note: No public REST route. The tool text says it "records the request to directory_leads and forwards a structured email" — a server-side write with no OpenAPI operation. inputSchema (firm_slug, prospect_email, scope_summary required; budget_band enum-ish) is the only contract.
  - tool: request_strategy_session
    category: lead
    a2a_skill: request-strategy-session
    rest: []
    binding: none
    confidence: high
    note: No public REST route. Creates a Google Calendar event + Meet link and emails the prospect. inputSchema requires prospect_email only.
  - tool: get_services
    category: catalog
    a2a_skill: tessa-services
    rest: []
    binding: none
    confidence: high
    note: >-
      No REST catalog operation. The nearest REST surface is the service-card fleet — /s (JSON index of 28 service
      cards, not in the OpenAPI) and service_agent_card_s__slug__agent_card_json_get — which the tool's response
      links to ("each service includes its live per-service A2A card URL and JSON-RPC endpoint").
  - tool: get_case_studies
    category: catalog
    a2a_skill: tessa-case-studies
    rest: []
    binding: none
    confidence: high
    note: No REST route. The human twin is https://tessa.tech/casestudies/ on the WordPress apex.
  - tool: get_wcag_audit
    category: catalog
    a2a_skill: get-wcag-audit
    rest: []
    binding: none
    confidence: high
    note: No REST route; zero-argument tool returning a structured offering.
  - tool: assess_ai_readiness
    category: assessment
    a2a_skill: ai-readiness-assessment
    rest: []
    binding: none
    confidence: high
    note: No REST route. Tool text says "pure deterministic check, fast, no LLM call"; the human twin is the /ai-agent-readiness/ service page.

