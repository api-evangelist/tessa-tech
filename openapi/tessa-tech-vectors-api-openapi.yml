openapi: 3.2.0
info:
  title: Tessa Tech Vectors API
  version: 0.1.0
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Vectors across 2 of this provider''s published API definitions: tessa-tech-openapi.json, tessa-tech-agent-directory-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://aiagent.tessa.tech
  description: TESSA's own agent host — agent card, A2A JSON-RPC, MCP (/mcp/), service cards (/s), OpenAPI. Registry-scoped routes return 421 here.
- url: https://complianceregistry.net
  description: TESSA-operated Compliance Registry (same application, same spec bytes). Registry routes (/registry.json, /taxonomy, /extensions, /{slug}) resolve here.
- url: https://marketingregistry.org
  description: TESSA-operated Local Business / Marketing Registry (same application, same spec bytes).
tags:
- name: Vectors
paths:
  /vectors/health:
    get:
      summary: Vectors Health
      description: 'Unauthenticated liveness probe: is the extension present and the table there?'
      operationId: vectors_health_vectors_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Vectors
  /vectors/info:
    get:
      summary: Vectors Info
      operationId: vectors_info_vectors_info_get
      parameters:
      - name: collection
        in: query
        required: true
        schema:
          type: string
          title: Collection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Vectors
  /vectors/search:
    post:
      summary: Vectors Search
      description: 'Dense + keyword search fused with reciprocal rank fusion.


        Both legs receive the same filter, matching how the Qdrant client applied

        the filter to both prefetch branches.'
      operationId: vectors_search_vectors_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Vectors
  /vectors/upsert:
    post:
      summary: Vectors Upsert
      description: 'Insert or replace points. Matches Qdrant''s upsert-by-point-id semantics.


        Conflict target is (collection, id), not id alone: the plugins derive point

        IDs from post_id/chunk_index without the collection, so both plugins produce

        identical IDs for the same WordPress post. Keying on id alone let one

        collection''s upsert steal rows from the other.


        The `bm25` sparse vector Qdrant used is ignored: Postgres derives the

        keyword index from chunk_text via a generated tsvector column.'
      operationId: vectors_upsert_vectors_upsert_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Vectors
  /vectors/delete:
    post:
      summary: Vectors Delete
      description: 'Delete every point in a collection matching a Qdrant-style filter.


        An absent/empty filter clears the whole collection, which is what the

        plugin''s delete_collection() relies on. Deliberately scoped to the

        collection: the table is shared, so a DROP would take out both plugins.'
      operationId: vectors_delete_vectors_delete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Vectors
components:
  schemas:
    UpsertRequest:
      properties:
        collection:
          type: string
          maxLength: 64
          minLength: 1
          title: Collection
        points:
          items:
            $ref: '#/components/schemas/Point'
          type: array
          title: Points
      type: object
      required:
      - collection
      - points
      title: UpsertRequest
    SearchRequest:
      properties:
        collection:
          type: string
          maxLength: 64
          minLength: 1
          title: Collection
        vector:
          items:
            type: number
          type: array
          minItems: 1
          title: Vector
        query:
          type: string
          title: Query
          default: ''
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 10
        prefetch_limit:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: Prefetch Limit
          default: 20
        filter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filter
      type: object
      required:
      - collection
      - vector
      title: SearchRequest
    Point:
      properties:
        id:
          type: string
          title: Id
        vector:
          anyOf:
          - additionalProperties: true
            type: object
          - items:
              type: number
            type: array
          title: Vector
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - id
      - vector
      title: Point
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DeleteRequest:
      properties:
        collection:
          type: string
          maxLength: 64
          minLength: 1
          title: Collection
        filter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filter
      type: object
      required:
      - collection
      title: DeleteRequest
x-refined-from:
- tessa-tech-openapi.json
- tessa-tech-agent-directory-openapi.yml
