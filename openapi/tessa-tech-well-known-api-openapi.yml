openapi: 3.2.0
info:
  title: Tessa Tech .well Known API
  version: 0.1.0
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged .well Known across 2 of this provider''s published API definitions: tessa-tech-openapi.json, tessa-tech-agent-directory-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://aiagent.tessa.tech
  description: TESSA's own agent host — agent card, A2A JSON-RPC, MCP (/mcp/), service cards (/s), OpenAPI. Registry-scoped routes return 421 here.
- url: https://complianceregistry.net
  description: TESSA-operated Compliance Registry (same application, same spec bytes). Registry routes (/registry.json, /taxonomy, /extensions, /{slug}) resolve here.
- url: https://marketingregistry.org
  description: TESSA-operated Local Business / Marketing Registry (same application, same spec bytes).
tags:
- name: .well Known
paths:
  /.well-known/agent-card.json:
    get:
      summary: Well Known Agent Card
      operationId: well_known_agent_card__well_known_agent_card_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - .well Known
  /.well-known/did.json:
    get:
      summary: Well Known Did Document
      description: Backs did:web:tessa.tech — tessa.tech/.well-known/did.json 301s here.
      operationId: well_known_did_document__well_known_did_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - .well Known
  /.well-known/mcp/server.json:
    get:
      summary: Mcp Server Manifest
      description: 'The MCP registry manifest for whichever host was asked.


        aiagent.tessa.tech serves server.json; each registry domain serves its own

        server-.json (the files had been in the repo since Phase 1b, but this

        route only ever answered on the ''mcp'' surface, so both registries 404''d).'
      operationId: mcp_server_manifest__well_known_mcp_server_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - .well Known
x-refined-from:
- tessa-tech-openapi.json
- tessa-tech-agent-directory-openapi.yml
