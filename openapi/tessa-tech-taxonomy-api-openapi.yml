openapi: 3.2.0
info:
  title: Tessa Tech Taxonomy API
  version: 0.1.0
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Taxonomy across 2 of this provider''s published API definitions: tessa-tech-openapi.json, tessa-tech-agent-directory-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://aiagent.tessa.tech
  description: TESSA's own agent host — agent card, A2A JSON-RPC, MCP (/mcp/), service cards (/s), OpenAPI. Registry-scoped routes return 421 here.
- url: https://complianceregistry.net
  description: TESSA-operated Compliance Registry (same application, same spec bytes). Registry routes (/registry.json, /taxonomy, /extensions, /{slug}) resolve here.
- url: https://marketingregistry.org
  description: TESSA-operated Local Business / Marketing Registry (same application, same spec bytes).
tags:
- name: Taxonomy
paths:
  /taxonomy:
    get:
      summary: Taxonomy Index
      operationId: taxonomy_index_taxonomy_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
      tags:
      - Taxonomy
  /taxonomy/:
    get:
      summary: Taxonomy Index
      operationId: taxonomy_index_taxonomy__get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
      tags:
      - Taxonomy
  /taxonomy/{name}.json:
    get:
      summary: Taxonomy Json
      operationId: taxonomy_json_taxonomy__name__json_get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Taxonomy
  /taxonomy/{name}/v{version}:
    get:
      summary: Taxonomy Versioned
      operationId: taxonomy_versioned_taxonomy__name__v_version__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: version
        in: path
        required: true
        schema:
          type: string
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Taxonomy
  /taxonomy/{name}:
    get:
      summary: Taxonomy No Suffix
      description: 'Forgiving route — serve JSON without the .json suffix if the name

        matches a known taxonomy file. Must come LAST so it doesn''t eat the

        ``/taxonomy/{name}/v{version}`` route.'
      operationId: taxonomy_no_suffix_taxonomy__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Taxonomy
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
x-refined-from:
- tessa-tech-openapi.json
- tessa-tech-agent-directory-openapi.yml
