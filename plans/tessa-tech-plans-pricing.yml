summary: >-
  TESSA publishes starting prices for its professional SERVICES, not for API access. Every agent surface catalogued in
  this repo — the A2A agent, the MCP server, the agent directory REST API, the agent card fleet — is free and
  anonymous; there is no API plan, quota, overage or paid tier anywhere. The prices below are what the agent's
  get_services / request_quote tools are about: monthly retainers and one-off projects, in USD, "starting points"
  customised per business. Recorded because a buyer agent calling this provider needs the commercial context, and
  because the provider went to the trouble of publishing it as Markdown for agents.
