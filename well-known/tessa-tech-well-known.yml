  path_echo_control: passed
  note: >-
    TESSA serves a real discovery surface split across two hosts. The WordPress apex tessa.tech publishes RFC
    8414 authorization-server metadata and RFC 9728 protected-resource metadata for its OAuth-gated WordPress
    MCP server (resource https://tessa.tech/wp-json/mcp/mcp-oauth-server, scope "mcp", PKCE S256,
    client_id_metadata_document_supported), plus /llms.txt and a robots.txt that explicitly welcomes AI agents;
    it 3xx-redirects /.well-known/agent-card.json and /.well-known/did.json to the agent host. The agent host
    aiagent.tessa.tech serves the A2A agent card (captured in a2a/), an MCP server.json
    (static.modelcontextprotocol.io 2025-12-11 schema, remotes[] streamable-http at /mcp/), and a did:web
    document. Neither host serves security.txt, OIDC discovery, an RFC 9727 API catalog, APIs.json, an AAuth
    resource document, ai-plugin.json or a UCP/ACP manifest. The MCP resource host (aiagent.tessa.tech) serves NO
    RFC 9728 protected-resource metadata of its own — consistent with that MCP server being anonymous. A
    negative-control path that cannot exist 404s on both origins, so every 200 above is a served document.
    Both WordPress-host 404s are real WordPress "Page not found" pages (152,851 bytes) and the FastAPI 404s are
    22-byte JSON, not SPA shells. Mid-probe, tessa.tech answered a burst of redirected www requests with
    Cloudflare 429 challenge pages ("Just a moment..."); those paths had already been probed directly on the
    apex and are recorded there.
