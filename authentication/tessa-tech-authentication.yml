source: >-
  The provider's OpenAPI (openapi/tessa-tech-agent-directory-openapi.yml) declares NO securitySchemes and no
  security requirements, so 0-working/derive-authentication.py correctly produced nothing. This profile is
  assembled instead from live anonymous probes of every surface on 2026-09-19 and from the two OAuth discovery
  documents TESSA publishes on its apex (well-known/tessa-tech-oauth-authorization-server.json,
  well-known/tessa-tech-oauth-protected-resource.json).
summary:
  types: [none, oauth2, admin-token]
  api_key_in: []
  oauth2_flows: [authorizationCode]
  note: >-
    Three distinct postures on two hosts. (1) Everything on aiagent.tessa.tech that an agent uses — the agent card,
    the A2A JSON-RPC endpoint, the MCP server (initialize + tools/list), the OpenAPI, the service-card fleet — is
    ANONYMOUS: no credential was sent to any of them and none challenged. (2) A handful of operator routes on the
    same host (/admin/*, /internal/*) answer 401 {"detail":"Invalid or missing admin token"} — a bearer/admin token
    the OpenAPI does not describe. (3) The WordPress MCP server on tessa.tech is OAuth 2.1: RFC 8414 metadata names
    the issuer, endpoints, PKCE S256, public clients only (token_endpoint_auth_methods_supported ["none"]), a single
    scope "mcp", and client_id_metadata_document_supported true — the MCP-authorization client-registration
    pattern in which the client_id is an https URL to a metadata document instead of a pre-registered id.
