    1.30.0, protocolVersion 2025-06-18) exposing ten tools: TESSA''s service catalog, case studies and WCAG audit
    offering, an AI Agent Readiness assessment for any URL, professional-services directory search and firm profiles,
    and four lead-creating tools (strategy-session booking, introduction, quote, listing claim). Advertised by /.well-known/mcp/server.json
