- name: TESSA MCP Server
  description: >-
    Hosted, anonymous MCP server (Streamable HTTP at https://aiagent.tessa.tech/mcp/, serverInfo tessa-mcp-server
    1.30.0, protocolVersion 2025-06-18) exposing ten tools: TESSA's service catalog, case studies and
    WCAG audit offering, an AI Agent Readiness assessment for any URL, professional-services directory
    search and firm profiles, and four lead-creating tools (strategy-session booking, introduction, quote,
    listing claim). Advertised by /.well-known/mcp/server.json and the did:web document. A second MCP
    server on the WordPress apex (https://tessa.tech/wp-json/mcp/mcp-oauth-server) is OAuth 2.1-gated
    with RFC 8414/9728 discovery published on tessa.tech.
  humanURL: https://aiagent.tessa.tech/
