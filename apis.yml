- name: TESSA Agent Directory API
  description: 'FastAPI service behind aiagent.tessa.tech: the A2A agent card and JSON-RPC endpoint, per-service
    and per-tenant agent cards, the professional-services directory (firm cards and profiles, introduction requests,
    claim / verify / removal / takedown flows), the TESSA Professional Services A2A extension and service-type taxonomies,
    and an admin/vector surface. 51 operations, OpenAPI 3.1.0, no securitySchemes declared (admin routes answer
    401 on a token the spec does not describe). The same application serves complianceregistry.net and marketingregistry.org;
    registry-scoped routes return 421 on aiagent.tessa.tech.'
