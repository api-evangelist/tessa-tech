aid: tessa-tech
name: TESSA Marketing & Technology
description: 'TESSA Marketing & Technology is a McLean, Virginia digital marketing and web development agency (est.
  2012) selling SEO, paid search and social advertising, generative engine optimization, WordPress and custom web/app
  development, WCAG 2.2 AA accessibility audits, AI website search and avatars, and an AI Agent Readiness service.
  It publishes an unusually complete agent surface for a services firm: an A2A agent card (protocolVersion 0.3.0,
  nine skills) and JSON-RPC endpoint on aiagent.tessa.tech, an anonymous hosted MCP server (Streamable HTTP, ten
  tools with published inputSchema) advertised through an MCP server.json and a did:web document, a 28-card per-service
  A2A fleet, a FastAPI OpenAPI for the directory service behind it, RFC 8414/9728 OAuth discovery for a second OAuth
  2.1-gated WordPress MCP server, llms.txt, a Markdown pricing twin, and an AI-welcoming robots.txt. TESSA also
  operates two vertical A2A registries, complianceregistry.net and marketingregistry.org.'
